<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN"><head><meta charset="utf-8"/><title>研究语料库</title><link rel="stylesheet" href="appearance.css"/><link rel="stylesheet" href="shared/reader-workspace.css"/><link rel="stylesheet" href="research-resources.css"/><link rel="stylesheet" href="research-corpus-scope.css"/><script src="appearance.js"></script><script type="module" src="research-resources.mjs"></script></head>
<body class="research-resources"><header><div class="resource-heading"><h1>语料库</h1><span id="project-context"></span></div><div class="resource-actions"><button id="import-library">导入 Zotero 文库</button><button id="zotero-sync">连接 Zotero 同步</button></div></header>
<main><aside><div class="corpus-create"><input id="corpus-name" placeholder="新语料库名称" aria-label="新语料库名称"/><button id="create-corpus" data-write="true">新建</button></div><details id="corpus-create-scope" class="corpus-scope-fields"><summary>研究领域与关键词</summary><label>研究领域<select id="corpus-domain" aria-label="新语料库研究领域"><option value="">不限研究领域</option></select></label><label>第一关键词<input id="corpus-primary" aria-label="新语料库第一关键词" placeholder="研究对象或任务"/></label><label>第二关键词<input id="corpus-secondary" aria-label="新语料库第二关键词" placeholder="方法或条件（可选）"/></label></details><nav id="corpus-list" aria-label="语料库"></nav></aside>
<section><div class="resource-toolbar"><div class="resource-title-row"><h2 id="corpus-title">语料库</h2><span id="result-count"></span><span id="corpus-scope" class="corpus-scope-summary"></span><button id="edit-corpus-scope" type="button" data-write="true" hidden="hidden">编辑范围</button><div class="resource-actions"><button id="collect" data-write="true">收集项目论文</button><button id="ai-collect" data-write="true">AI 挑选</button><button id="stop-collect" type="button" hidden="hidden">停止收集</button><button id="add-entry" data-write="true">添加语料</button></div></div><form id="corpus-scope-form" class="corpus-scope-fields" hidden="hidden"><label>研究领域<select id="corpus-scope-domain" aria-label="语料库研究领域"><option value="">不限研究领域</option></select></label><label>第一关键词<input id="corpus-scope-primary" aria-label="语料库第一关键词"/></label><label>第二关键词<input id="corpus-scope-secondary" aria-label="语料库第二关键词"/></label><div class="resource-actions"><button type="submit" data-write="true">保存范围</button><button type="button" id="corpus-scope-cancel">取消</button></div></form><form id="ai-purpose-form" class="corpus-scope-fields" hidden="hidden"><label>研究目的或筛选条件<input id="ai-purpose" placeholder="例如：描述低温样品测量装置和条件的段落"/></label><div class="resource-actions"><button type="submit" data-write="true">开始挑选</button><button type="button" id="ai-purpose-cancel">取消</button></div></form><div class="resource-filter-row"><input id="query" type="search" placeholder="搜索标题、内容或标签" aria-label="搜索语料"/><select id="section" aria-label="章节筛选"><option value="">全部章节</option></select><button id="clear-filters" hidden="hidden">清空筛选</button><label class="resource-select-all"><input id="select-all" type="checkbox"/>全选结果</label></div></div>
<p id="status" role="status"></p><form id="entry-form" class="corpus-scope-fields" hidden="hidden"><label>语料标题<input id="entry-title" placeholder="例如：样品制备与测量条件" required="required"/></label><label>章节<select id="entry-section"></select></label><label>完整正文<textarea id="entry-text" rows="9" placeholder="粘贴完整段落或连续章节内容" required="required"></textarea></label><label>标签<input id="entry-tags" placeholder="例如：方法，实验条件"/></label><div class="resource-actions"><button type="submit" data-write="true">保存语料</button><button type="button" id="entry-cancel">取消</button></div></form>
<div id="entries"></div><footer id="project-actions" hidden="hidden"><span id="selection-count"></span><button id="import-project" data-write="true">导入当前装配</button></footer></section></main></body></html>
