<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN"><head><meta charset="utf-8"/><title>研究语料库</title><link rel="stylesheet" href="appearance.css"/><link rel="stylesheet" href="shared/reader-workspace.css"/><link rel="stylesheet" href="research-resources.css"/><script src="appearance.js"></script><script type="module" src="research-resources.mjs"></script></head><body class="research-resources"><header><div><small>研究资料</small><h1>语料库</h1></div><div class="resource-actions"><button id="import-library">导入 Zotero 文库</button><button id="zotero-sync">连接 Zotero 同步</button></div></header><main><aside><div class="corpus-create"><input id="corpus-name" placeholder="新语料库名称" aria-label="新语料库名称"/><button id="create-corpus">新建</button></div><nav id="corpus-list" aria-label="语料库"></nav><p class="resource-hint">按文章章节保存完整语料，保留来源。</p></aside><section><div class="resource-toolbar"><input id="query" type="search" placeholder="搜索标题、内容或标签" aria-label="搜索语料"/><select id="section" aria-label="章节筛选"><option value="">全部章节</option></select><button id="collect">收集所选论文</button><button id="ai-collect">AI 挑选</button><button id="add-entry">添加语料</button></div><p id="status" role="status"></p><form id="entry-form" hidden="hidden"><input id="entry-title" placeholder="语料标题" required="required"/><select id="entry-section" aria-label="语料章节"></select><textarea id="entry-text" rows="9" placeholder="粘贴完整段落或连续章节内容" required="required"></textarea><input id="entry-tags" placeholder="标签，以逗号分隔"/><button type="submit">保存语料</button><button type="button" id="entry-cancel">取消</button></form><div id="entries"></div><footer id="project-actions" hidden="hidden"><span id="selection-count"></span><button id="import-project">导入当前装配</button></footer></section></main></body></html>
