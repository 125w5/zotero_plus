<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>素材库</title><link rel="stylesheet" href="notebook.css"><link rel="stylesheet" href="appearance.css"><script src="appearance.js"></script><script type="module" src="notebook.mjs"></script><link rel="stylesheet" href="surface.css"><link rel="stylesheet" href="shared/unified-ui.css"></head><body>
<header><button id="library-home" title="管理所有主题和项目素材">素材库 ▾</button><h1 id="title">素材库</h1><span>来源 → 阅读与讨论 → 研究产物</span><button id="back">进入论文装配</button></header>
<div id="workspace"><aside id="sources"><div class="pane-title">来源与素材 <small id="count"></small></div><div class="search-bar"><input id="search" aria-label="搜索素材" placeholder="搜索中文说明、方法、原文"><button id="organize" class="primary">自动整理</button></div><div id="material-view-controls"></div><div id="recent-searches"></div><nav id="topic-navigation" aria-label="按研究主题浏览"></nav><div id="source-filters"><select hidden id="topic" aria-label="研究主题"></select><select hidden id="type" aria-label="素材类型"></select><select id="sort" aria-label="素材排序"><option value="relevance">搜索相关性</option><option value="manual">手动排序</option></select><button id="import-image">导入图片并整理</button><button id="generate-illustration">生成图片</button></div><p id="selection-count" role="status"></p><div id="source-list"></div></aside>
<main><nav><button id="read-tab" aria-selected="true">阅读与来源问答</button><button id="plan-tab">Idea 与实验</button></nav><section id="reading"><div id="reading-scroll"><div tabindex="-1" id="detail" class="empty">选择左侧素材，在这里阅读来源、修改中文说明或继续提问。</div><div id="messages"></div></div><form id="question-form"><label class="ai-mode-label">AI 模式 <select id="ai-mode" aria-label="AI 模式，空输入按 Tab 切换"></select><small>点击输入显示模板 · Tab 选择 · Enter 应用</small></label><textarea id="question" aria-label="向来源提问" placeholder="围绕所选来源继续提问，例如：这个方法的适用条件是什么？"></textarea><button id="send-question">发送</button></form></section>
<section id="evaluation" hidden><nav class="workflow-progress" aria-label="论文创建流程"><button id="project-stage-name"><span>1</span>论文名称与文献</button><i class="step-connector"></i><button aria-current="step" id="project-stage-plan"><span>2</span>可行性与结构</button><i class="step-connector"></i><button id="project-stage-assembly"><span>3</span>素材选择与装配</button></nav><h2>让研究问题成为可验证的方案</h2><p id="assessment-status" role="status"></p><p>从项目文献出发，确定实验计划与章节任务，再进入素材选择和写作速读。</p><section class="preparation-source-selection" aria-label="本次可行性分析使用的论文"><div class="preparation-source-heading"><label for="project-paper-folder">项目文献文件夹</label><button id="project-new-folder">新建同名文件夹</button></div><select id="project-paper-folder" aria-label="项目文献文件夹"></select><p id="project-paper-summary" class="muted" role="status"></p><details><summary>选择参与分析的论文</summary><div id="project-paper-list"></div><button id="project-papers-all">全选</button><button id="project-papers-none">取消全选</button></details></section><textarea id="idea" aria-label="研究想法与条件" placeholder="写下 Idea、现有数据和资源；也可以说明上一版中想调整的假设。"></textarea><details><summary>资源条件（可选）</summary><textarea id="constraints" placeholder="数据、代码、算力、时间；未知项会列入待补"></textarea></details><details class="preparation-structure"><summary>章节结构与写作任务</summary><textarea id="structure" aria-label="章节结构与写作任务" placeholder="每行一个章节，可用｜补充本章的论证任务，例如：引言｜说明研究缺口与本研究问题"></textarea><p class="muted">此结构和方案将一起带入装配；已经写过的章节与正文不会自动删除。</p></details><div class="preparation-actions"><button id="evaluate" class="primary">评估并制定实验方案</button><button id="continue-assembly">保存并进入素材选择</button></div><div id="plan"></div><div id="plan-discussion"></div></section>
</main><aside id="artifacts"><div class="pane-title">研究产物</div><p class="muted">确认方案后，可作为稿件的关联资料。旧版本和实验记录保留。</p><div id="artifact-list"></div><details><summary>方案版本</summary><div id="versions"></div></details><details><summary>已确认决策与反对意见</summary><div id="decisions"></div></details></aside></div>
<footer><span id="status" role="status">正在恢复素材…</span><button id="cancel" hidden>停止</button><details><summary>任务记录</summary><div id="logs"></div></details></footer>
</body></html>
