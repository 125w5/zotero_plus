<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>素材库</title><link rel="stylesheet" href="notebook.css"><link rel="stylesheet" href="appearance.css"><script src="appearance.js"></script><script type="module" src="notebook.mjs"></script><link rel="stylesheet" href="surface.css"><link rel="stylesheet" href="shared/unified-ui.css"><link rel="stylesheet" href="shared/reader-workspace.css"></head><body>
<header><button id="library-home" title="管理所有主题和项目素材">素材库 ▾</button><h1 id="title">素材库</h1><span>来源 → 阅读与讨论 → 研究产物</span><button id="back">进入论文装配</button></header>
<div id="workspace"><aside id="sources"><div class="pane-title">来源与素材 <small id="count"></small></div><div class="search-bar"><input id="search" aria-label="搜索素材" placeholder="搜索中文说明、方法、原文"><button id="organize" class="primary">自动整理</button></div><div id="material-view-controls"></div><div id="recent-searches"></div><nav id="topic-navigation" aria-label="按研究主题浏览"></nav><div id="source-filters"><select hidden id="topic" aria-label="研究主题"></select><select hidden id="type" aria-label="素材类型"></select><select id="sort" aria-label="素材排序"><option value="relevance">搜索相关性</option><option value="manual">手动排序</option></select><button id="import-image">导入图片并整理</button><button id="generate-illustration">生成图片</button></div><p id="selection-count" role="status"></p><div id="source-list"></div></aside>
<main><nav><button id="read-tab" aria-selected="true">阅读与来源问答</button><button id="plan-tab">Idea 与实验</button></nav><section id="reading"><div id="reading-scroll"><div tabindex="-1" id="detail" class="empty">选择左侧素材，在这里阅读来源、修改中文说明或继续提问。</div><div id="messages"></div></div><form id="question-form"><label class="ai-mode-label">AI 模式 <select id="ai-mode" aria-label="AI 模式，空输入按 Tab 切换"></select><small>点击输入显示模板 · Tab 选择 · Enter 应用</small></label><textarea id="question" aria-label="向来源提问" placeholder="围绕所选来源继续提问，例如：这个方法的适用条件是什么？"></textarea><button id="send-question">发送</button></form></section>
<section id="evaluation" hidden><nav class="workflow-progress" aria-label="论文创建流程"><button id="project-stage-name"><span>1</span>研究主题</button><i class="step-connector"></i><button aria-current="step" id="project-stage-plan"><span>2</span>可行性方案</button><i class="step-connector"></i><button id="project-stage-assembly"><span>3</span>素材装配</button></nav><div class="preparation-heading"><div><h2>可行性方案</h2><p id="assessment-status" role="status"></p></div><select id="plan-version" aria-label="查看方案版本"><option value="">尚无方案</option></select></div><section class="preparation-input-card"><div class="preparation-source-selection" aria-label="本次研究资料范围"><label for="project-paper-folder">资料范围</label><select id="project-paper-folder" aria-label="项目文献文件夹"></select><button id="project-new-folder" title="新建项目文献文件夹">新建文件夹</button><small id="project-paper-summary" class="muted" role="status"></small><div hidden id="project-paper-list"></div><button hidden id="project-papers-all"></button><button hidden id="project-papers-none"></button></div><div class="research-scope-fields"><label>研究领域<select id="research-domain" aria-label="研究领域"><option value="">选择研究领域</option></select></label><label>第一关键词<input id="primary-keyword" aria-label="第一关键词" placeholder="研究对象或任务，如调制识别"></label><label>第二关键词<input id="secondary-keyword" aria-label="第二关键词" placeholder="方法或条件，如低信噪比"></label><label class="scope-fuzzy"><input type="checkbox" id="scope-fuzzy" checked>模糊匹配</label></div><p id="scope-hint" class="scope-hint">两个关键词共同限定方向；同义词可用分号分隔。</p><label class="idea-label" for="idea">研究问题</label><textarea id="idea" aria-label="研究想法与条件" placeholder="你想解决什么问题？已有数据、方法和预期差异是什么？"></textarea><div class="preparation-option-row"><details><summary>资源条件</summary><textarea id="constraints" aria-label="资源条件" placeholder="数据、设备、算力与时间预算"></textarea></details><details class="preparation-structure"><summary>章节结构</summary><textarea id="structure" aria-label="章节结构与写作任务" placeholder="每行一个章节，如：引言｜说明研究缺口与研究问题"></textarea><p class="muted">结构与方案一同带入装配，保留已有正文。</p></details></div><div class="preparation-actions"><button id="evaluate" class="primary">生成可行性方案</button><button id="continue-assembly">确认并进入装配</button></div></section><nav id="plan-result-tabs" class="plan-result-tabs" aria-label="方案内容"><button data-plan-panel="feasibility" aria-selected="true"><span>01</span><strong>可行性</strong><small>条件与验证</small></button><button data-plan-panel="novelty"><span>02</span><strong>创新点</strong><small>差异与依据</small></button><button data-plan-panel="suggestions"><span>03</span><strong>建议</strong><small>实验与写作</small></button><button data-plan-panel="history"><span>04</span><strong>讨论与修改</strong><small>版本与决定</small></button></nav><div id="plan" aria-live="polite"></div><div id="plan-discussion" hidden></div></section>
</main><aside id="artifacts"><div class="pane-title">研究产物</div><p class="muted">确认方案后，可作为稿件的关联资料。旧版本和实验记录保留。</p><div id="artifact-list"></div><details><summary>方案版本</summary><div id="versions"></div></details><details><summary>已确认决策与反对意见</summary><div id="decisions"></div></details></aside></div>
<footer><span id="status" role="status">正在恢复素材…</span><button id="cancel" hidden>停止</button><details><summary>任务记录</summary><div id="logs"></div></details></footer>
</body></html>
