<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>论文装配</title>
<link rel="localization" href="easysch.ftl">
<script type="module" src="shared/workspace-loading-boot.mjs"></script>
<link rel="stylesheet" href="manuscript.css"><link rel="stylesheet" href="vendor/katex.min.css">
<script src="vendor/katex.js"></script><script type="module" src="manuscript/main.mjs"></script><link rel="stylesheet" href="appearance.css"><script src="appearance.js"></script><link rel="stylesheet" href="surface.css"><link rel="stylesheet" href="brand/brand.css"><link rel="stylesheet" href="manuscript/coauthor.css"><link rel="stylesheet" href="manuscript/workspace-surface.css"><link rel="stylesheet" href="shared/reader-workspace.css"></head>
<body data-workspace-chrome="true"><link rel="stylesheet" href="manuscript/refined-surface.css"><link rel="stylesheet" href="manuscript/manual-writing-tools.css"><link rel="stylesheet" href="manuscript/material-detail-tools.css"><link rel="stylesheet" href="shared/unified-ui.css"><link rel="stylesheet" href="manuscript/assembly-composer.css"><link rel="stylesheet" href="manuscript/assembly-workflow.css"><link rel="stylesheet" href="shared/workspace-controls.css"><link rel="stylesheet" href="shared/workflow-progress.css"><header><span id="project-title"></span><nav id="steps" aria-label="论文装配流程"></nav><div class="assembly-export-actions"><button id="preview">预览 Word</button><button id="export" title="导出论文正文和当前执行方案，两份可编辑 Word">导出 Word</button></div></header>
<div id="workspace"><aside id="left"><nav id="left-tabs"></nav><div id="library"></div><div class="resize-panel" data-panel="leftWidth"></div></aside>
<main><div id="tools"><button id="toggle-left" title="收起或展开左栏">◧</button><div id="insert-tools"></div><button id="toggle-right" title="收起或展开详情">◨</button></div><div id="recommendation"></div><div id="canvas" tabindex="-1"></div></main>
<aside id="right"><div class="resize-panel" data-panel="rightWidth"></div><section id="workflow-panel" hidden aria-label="当前流程"></section><div id="details"></div></aside></div>
<section id="ai" hidden aria-label="研究助手"><div class="ai-grip" title="拖动调整对话高度"></div>
<div class="ai-panel">
 <div class="ai-heading"><small id="ai-context" hidden></small><button id="collapse-chat" type="button" title="收起为输入栏" aria-label="收起对话">⌄</button></div>
 <div class="ai-history-layout"><aside id="ai-session-context" aria-label="对话与资料"></aside><div id="ai-history"><div id="chat"></div><div id="diff"></div></div><aside id="ai-evidence" hidden aria-label="回答依据"></aside></div>
 <div id="ai-notice" role="status" hidden></div>
</div></section>
<footer><div id="ai-session-tools"><button id="toggle-ai" title="展开研究助手" aria-label="展开研究助手">研究助手</button></div>
 <form id="ai-form">
  <button class="ai-collapsed-name" type="button" title="展开 研究助手"><span class="easysch-symbol" aria-hidden="true"></span><span>研究助手</span></button>
  <textarea id="ai-prompt" rows="1" aria-label="研究助手输入" placeholder="查找资料、检查证据，或整理章节与素材顺序…"></textarea>
  <div id="ai-attachments" hidden aria-label="本次对话附件"></div>
  <div class="ai-compose-actions"><button id="ai-template-toggle" type="button" title="选择研究任务 · Tab 或鼠标" aria-haspopup="true" aria-expanded="false">任务 ⌄</button><select id="ai-mode" aria-label="AI 模式，空输入按 Tab 切换" title="选择研究任务"></select><button id="ai-attach" type="button" title="添加文件、图片或素材" aria-label="添加文件、图片或素材">＋</button><button id="ai-options" type="button" title="模型与推理等级" aria-label="模型与推理等级">⋯</button><small class="compose-key-hint">Enter 发送 · Shift+Enter 换行</small><button id="ask-ai" title="Enter 发送，Shift+Enter 换行" aria-label="发送研究问题">↑</button><button type="button" id="cancel-ai" hidden>停止</button></div>
 </form>
<span id="status" role="status" hidden></span><div id="footer-actions"><button id="cancel-task" hidden>停止</button><button id="check" title="检查当前论文的证据与缺失内容">核验</button><span id="save-status" aria-live="polite">尚未保存</span></div></footer>
<dialog id="popover"><button id="close-popover" aria-label="关闭">×</button><div id="popover-content"></div></dialog></body></html>
